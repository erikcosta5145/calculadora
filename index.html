<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Calculadora Dark</title>

  <link rel="stylesheet" href="css/style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <main class="calculator-container">

    <div class="calculator">

      <div class="top-bar">
        <h1>Calculadora Dark</h1>

        <button id="themeToggle">
          🌙
        </button>
      </div>

      <div class="display-container">

        <div id="history" class="history">
          Histórico
        </div>

        <input
          type="text"
          id="display"
          class="display"
          readonly
        />
      </div>

      <div class="buttons">

        <button class="operator" onclick="clearDisplay()">
          C
        </button>

        <button class="operator" onclick="deleteLast()">
          ⌫
        </button>

        <button class="operator" onclick="appendValue('%')">
          %
        </button>

        <button class="operator" onclick="appendValue('/')">
          ÷
        </button>

        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>

        <button class="operator" onclick="appendValue('*')">
          ×
        </button>

        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>

        <button class="operator" onclick="appendValue('-')">
          −
        </button>

        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>

        <button class="operator" onclick="appendValue('+')">
          +
        </button>

        <button onclick="appendValue('0')" class="zero">
          0
        </button>

        <button onclick="appendValue('.')">
          .
        </button>

        <button class="equal" onclick="calculate()">
          =
        </button>

      </div>

    </div>

  </main>

  <script src="js/script.js"></script>

</body>
</html>
